name: Compilar Sentinela

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore Sentinela.sln

      - name: Compilar
        run: dotnet build Sentinela.sln --configuration Release --no-restore
